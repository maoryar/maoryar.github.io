<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חוגזי | Choogzi - סטליסט</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #16181f;
            --accent-color: #e6683c;
            --accent-hover: #ff7b4d;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --glass-bg: rgba(22, 24, 31, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --player-h: 68px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Heebo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(220, 39, 67, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(188, 24, 136, 0.08) 0%, transparent 40%);
            /* room for the sticky player */
            padding-bottom: calc(var(--player-h) + 10px);
        }

        /* Compact header — deliberately smaller than the home page hero so more
           songs fit above the fold on mobile. */
        header {
            padding: 1.6rem 1.5rem 1rem;
            text-align: center;
        }

        .band-logo {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ffffff 30%, #9ca3af 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .band-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 300;
            margin-top: 0.2rem;
        }

        .back-link {
            display: inline-block;
            margin-top: 0.8rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 6px 16px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            transition: all 0.25s ease;
        }

        .back-link:hover { color: #fff; background: rgba(255, 255, 255, 0.12); }

        main {
            flex: 1;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            padding: 0 1rem 2rem;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .play-all-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 50px;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.98rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(230, 104, 60, 0.3);
            transition: all 0.25s ease;
        }

        .play-all-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            border-radius: 50px;
            padding: 9px 16px;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .icon-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.14); }

        /* Repeat button lights up when a mode is active */
        .icon-btn.repeat-on {
            color: var(--accent-hover);
            border-color: rgba(230, 104, 60, 0.5);
            background: rgba(230, 104, 60, 0.12);
        }

        .repeat-badge {
            font-size: 0.72rem;
            font-weight: 800;
            min-width: 1ch;
        }

        .count { color: var(--text-muted); font-size: 0.88rem; margin-inline-start: auto; }

        /* ---------- Song list ---------- */
        .song-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }

        .song {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 7px 10px 4px;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .song:hover { border-color: rgba(255, 255, 255, 0.18); }

        .song.active {
            border-color: rgba(230, 104, 60, 0.55);
            background: linear-gradient(90deg, rgba(230, 104, 60, 0.1), var(--card-bg) 60%);
        }

        .song-row { display: flex; align-items: center; gap: 9px; }

        .track-num {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            width: 1.4rem;
            text-align: center;
            flex: 0 0 auto;
            font-variant-numeric: tabular-nums;
        }

        .song.active .track-num { color: var(--accent-hover); }

        .play-btn {
            flex: 0 0 auto;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-main);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .play-btn:hover { background: var(--accent-color); border-color: var(--accent-color); }
        .song.active .play-btn { background: var(--accent-color); border-color: var(--accent-color); }
        .play-btn svg { width: 15px; height: 15px; fill: currentColor; }

        .song-title {
            flex: 1 1 auto;
            font-size: 1rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        .song-actions { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }

        .chip {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            border-radius: 20px;
            height: 28px;
            padding: 0 10px;
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .chip:hover { color: #fff; background: rgba(255, 255, 255, 0.15); }
        .chip svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; }
        .chip.square { padding: 0; width: 28px; justify-content: center; }
        .chip.bpm:hover { color: var(--accent-hover); border-color: rgba(230, 104, 60, 0.5); }
        .chip[aria-busy="true"] { opacity: 0.5; pointer-events: none; }

        /* Unavailable chips stay in the row (so every row lines up) but read as
           inert. Must come after the :hover rules above — equal specificity,
           source order wins. */
        .chip:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
        }

        .chip:disabled:hover {
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
        }

        /* ---------- Seek bar ----------
           direction:ltr on purpose: audio time reads left-to-right even in an
           RTL page, matching how YouTube/Spotify behave in Hebrew locales. */
        .seek-wrap { direction: ltr; padding: 2px 2px 0; }

        input[type="range"].seek {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 12px;
            background: transparent;
            cursor: pointer;
            display: block;
        }

        input[type="range"].seek::-webkit-slider-runnable-track {
            height: 3px;
            border-radius: 3px;
            background: linear-gradient(
                to right,
                var(--accent-color) 0%, var(--accent-color) var(--pct, 0%),
                rgba(255, 255, 255, 0.12) var(--pct, 0%), rgba(255, 255, 255, 0.12) 100%);
        }

        input[type="range"].seek::-moz-range-track {
            height: 3px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.12);
        }

        input[type="range"].seek::-moz-range-progress {
            height: 3px;
            border-radius: 3px;
            background: var(--accent-color);
        }

        input[type="range"].seek::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #fff;
            margin-top: -4px;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        input[type="range"].seek::-moz-range-thumb {
            width: 11px; height: 11px; border: none; border-radius: 50%;
            background: #fff; opacity: 0;
        }

        .song:hover input[type="range"].seek::-webkit-slider-thumb,
        .song.active input[type="range"].seek::-webkit-slider-thumb { opacity: 1; }
        .song:hover input[type="range"].seek::-moz-range-thumb,
        .song.active input[type="range"].seek::-moz-range-thumb { opacity: 1; }

        /* ---------- Sticky mini player ---------- */
        .player {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: var(--player-h);
            background: var(--glass-bg);
            backdrop-filter: blur(14px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 14px;
            z-index: 900;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .player.visible { transform: translateY(0); }

        .player-btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 50%;
            flex: 0 0 auto;
            transition: all 0.2s ease;
        }

        .player-btn:hover { background: rgba(255, 255, 255, 0.12); }
        .player-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .player-btn.main svg { width: 26px; height: 26px; }

        .player-info { flex: 1 1 auto; min-width: 0; }

        .player-title {
            font-size: 0.92rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-time {
            font-size: 0.76rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            direction: ltr;
            text-align: start;
        }

        /* ---------- Modals ---------- */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5, 6, 8, 0.94);
            backdrop-filter: blur(15px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px 20px 78px;   /* bottom reserved for the nav pill */
        }

        .modal.active { display: flex; animation: fadeIn 0.25s ease forwards; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-close {
            position: absolute;
            top: 20px; left: 20px;
            width: 44px; height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            z-index: 1010;
        }

        .modal-close:hover { background: rgba(255, 255, 255, 0.25); }

        /* Prev / position / next pill, shared by all three modals.
           Bottom-centre rather than side arrows so it never overlaps the PDF
           on narrow screens, and stays thumb-reachable on a phone.
           direction:ltr so the chevrons keep their physical meaning in RTL. */
        .modal-nav {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            direction: ltr;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 5px;
            border-radius: 40px;
            background: rgba(13, 14, 18, 0.82);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            z-index: 1010;
        }

        .modal-nav-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-main);
            font-size: 1.05rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .modal-nav-btn:hover { background: rgba(255, 255, 255, 0.15); }
        .modal-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; background: transparent; }

        .modal-nav-counter {
            min-width: 3.6rem;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        /* BPM visualizer */
        .bpm-box { text-align: center; user-select: none; }

        .bpm-song { color: var(--text-muted); font-size: 1rem; margin-bottom: 0.3rem; }
        .bpm-value { font-size: 3.4rem; font-weight: 900; line-height: 1; }
        .bpm-unit { font-size: 1rem; color: var(--text-muted); letter-spacing: 2px; margin-bottom: 1.8rem; }

        .pulse-stage {
            position: relative;
            width: 180px; height: 180px;
            margin: 0 auto 1.6rem;
            display: flex; align-items: center; justify-content: center;
        }

        .pulse-core {
            width: 96px; height: 96px;
            border-radius: 50%;
            background: var(--accent-color);
            box-shadow: 0 0 50px rgba(230, 104, 60, 0.5);
            transform: scale(0.82);
            transition: transform 90ms ease-out;
        }

        .pulse-core.hit { transform: scale(1.12); }

        .pulse-ring {
            position: absolute;
            inset: 0;
            border: 2px solid var(--accent-hover);
            border-radius: 50%;
            opacity: 0;
        }

        .pulse-ring.hit { animation: ringOut 0.6s ease-out; }

        @keyframes ringOut {
            from { opacity: 0.7; transform: scale(0.55); }
            to   { opacity: 0;   transform: scale(1.1); }
        }

        .beat-dots { display: flex; justify-content: center; gap: 14px; }

        .beat-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            transition: background 0.08s ease, transform 0.08s ease;
        }

        .beat-dot.on { background: var(--accent-hover); transform: scale(1.45); }
        .beat-dot.downbeat.on { background: #fff; }

        .bpm-hint { color: var(--text-muted); font-size: 0.85rem; margin-top: 1.4rem; }

        /* Chart (PDF) modal */
        .chart-frame-wrap {
            width: min(96vw, 900px);
            /* Fills the space the modal leaves above the nav pill, rather than a
               fixed vh that would sit under it. */
            height: 100%;
            max-height: 1000px;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            touch-action: manipulation;
        }

        /* Two chart renderers, picked per browser (see pickChartMode()):
           - native <iframe>, where the engine has an inline PDF viewer
           - PDF.js -> <canvas>, where it does not (Android Chromium)
           Only one is ever visible. */
        .chart-viewport {
            flex: 1;
            position: relative;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            background: #fff;
        }

        .chart-viewport > iframe {
            display: none;
            width: 100%;
            height: 100%;
            border: none;
        }

        .chart-viewport.native > iframe { display: block; }
        .chart-viewport.native { overflow: hidden; }
        .chart-viewport.native > .chart-pages { display: none; }

        .chart-pages {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 100%;
            padding: 4px;
        }

        .chart-pages canvas {
            display: block;
            max-width: 100%;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.25);
        }

        .chart-state {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
            text-align: center;
            padding: 1.5rem;
            background: #fff;
            color: #4b5563;
            font-size: 0.95rem;
        }

        .chart-state.visible { display: flex; }
        .chart-state.error { color: #b91c1c; }

        .chart-fallback {
            padding: 10px;
            text-align: center;
            background: var(--card-bg);
            border-top: 1px solid var(--glass-border);
        }

        .chart-fallback a { color: var(--accent-hover); font-size: 0.9rem; }

        /* Lyrics modal */
        .lyrics-box {
            width: min(94vw, 620px);
            max-height: 100%;
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 1.5rem 1.3rem 1.2rem;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
        }

        .lyrics-title {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 0.9rem;
            padding-inline-end: 2.6rem;
            flex: 0 0 auto;
        }

        .lyrics-body {
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.85;
            font-size: 1.05rem;
            -webkit-overflow-scrolling: touch;
        }

        .lyrics-body.msg {
            color: var(--text-muted);
            text-align: center;
            padding: 1.5rem 0;
            white-space: normal;
        }

        .lyrics-body.msg a { color: var(--accent-hover); }

        /* States */
        .state-msg { text-align: center; color: var(--text-muted); padding: 3rem 1rem; }
        .state-msg.error { color: #f87171; }

        footer {
            text-align: center;
            padding: 1.6rem 1.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--glass-border);
        }

        .sr-only {
            position: absolute; width: 1px; height: 1px;
            padding: 0; margin: -1px; overflow: hidden;
            clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
        }

        @media (max-width: 560px) {
            .band-logo { font-size: 1.8rem; }
            .band-subtitle { font-size: 0.85rem; }
            main { padding: 0 0.7rem 1.5rem; }
            .song { padding: 6px 8px 3px; border-radius: 9px; }
            .song-row { gap: 7px; }
            .song-title { font-size: 0.93rem; }
            .play-btn { width: 31px; height: 31px; }
            .track-num { width: 1.1rem; font-size: 0.74rem; }
            .chip { height: 26px; font-size: 0.72rem; padding: 0 8px; }
            .chip.square { width: 26px; padding: 0; }
            .play-all-btn { padding: 9px 18px; font-size: 0.9rem; }
            .icon-btn { padding: 8px 13px; font-size: 0.82rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1 class="band-logo">חוגזי</h1>
        <p class="band-subtitle">סטליסט • הקלטות, אקורדים וקצב</p>
        <a href="index.html" class="back-link">&#8594; חזרה לעמוד הראשי</a>
    </header>

    <main>
        <div class="toolbar">
            <button class="play-all-btn" id="play-all">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                נגן את כל הסט
            </button>

            <button class="icon-btn" id="repeat-btn" aria-pressed="false">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="17 1 21 5 17 9"/>
                    <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                    <polyline points="7 23 3 19 7 15"/>
                    <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                </svg>
                <span id="repeat-label">ללא חזרה</span>
                <span class="repeat-badge" id="repeat-badge"></span>
            </button>

            <span class="count" id="count"></span>
        </div>

        <ul class="song-list" id="song-list"></ul>
        <div class="state-msg" id="state">טוען את הסטליסט…</div>
    </main>

    <!-- Sticky mini player -->
    <div class="player" id="player">
        <button class="player-btn" id="p-prev" title="השיר הקודם" aria-label="השיר הקודם">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="player-btn main" id="p-toggle" title="נגן / השהה" aria-label="נגן או השהה">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="player-btn" id="p-next" title="השיר הבא" aria-label="השיר הבא">
            <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
        </button>
        <div class="player-info">
            <div class="player-title" id="p-title">—</div>
            <div class="player-time" id="p-time">0:00 / 0:00</div>
        </div>
    </div>

    <!-- BPM visualizer -->
    <div class="modal" id="bpm-modal" role="dialog" aria-modal="true" aria-labelledby="bpm-song">
        <button class="modal-close" id="bpm-close" aria-label="סגור">&times;</button>
        <div class="bpm-box">
            <div class="bpm-song" id="bpm-song"></div>
            <div class="bpm-value" id="bpm-value">60</div>
            <div class="bpm-unit">BPM</div>
            <div class="pulse-stage">
                <div class="pulse-ring" id="pulse-ring"></div>
                <div class="pulse-core" id="pulse-core"></div>
            </div>
            <div class="beat-dots" id="beat-dots"></div>
            <p class="bpm-hint">ויזואליזציה של הקצב • 4/4</p>
        </div>
    </div>

    <!-- Chart (PDF) viewer -->
    <div class="modal" id="chart-modal" role="dialog" aria-modal="true" aria-label="אקורדים">
        <button class="modal-close" id="chart-close" aria-label="סגור">&times;</button>
        <div class="chart-frame-wrap">
            <div class="chart-viewport" id="chart-viewport">
                <iframe id="chart-frame" title="אקורדים"></iframe>
                <div class="chart-pages" id="chart-pages"></div>
                <div class="chart-state" id="chart-state"></div>
            </div>
            <div class="chart-fallback">
                <a id="chart-open" href="#" target="_blank" rel="noopener noreferrer">לא נטען? פתח את ה-PDF בלשונית חדשה</a>
            </div>
        </div>
    </div>

    <!-- Lyrics viewer -->
    <div class="modal" id="lyrics-modal" role="dialog" aria-modal="true" aria-labelledby="lyrics-title">
        <button class="modal-close" id="lyrics-close" aria-label="סגור">&times;</button>
        <div class="lyrics-box">
            <h2 class="lyrics-title" id="lyrics-title"></h2>
            <div class="lyrics-body" id="lyrics-body"></div>
        </div>
    </div>

    <footer>
        &copy; <span id="year"></span> חוגזי • Choogzi - כל הזכויות שמורות
    </footer>

    <audio id="audio" preload="none"></audio>

    <script>
    (function () {
        'use strict';

        document.getElementById('year').textContent = new Date().getFullYear();

        var audio      = document.getElementById('audio');
        var listEl     = document.getElementById('song-list');
        var stateEl    = document.getElementById('state');
        var countEl    = document.getElementById('count');
        var player     = document.getElementById('player');
        var pTitle     = document.getElementById('p-title');
        var pTime      = document.getElementById('p-time');
        var pToggle    = document.getElementById('p-toggle');
        var repeatBtn  = document.getElementById('repeat-btn');
        var repeatLbl  = document.getElementById('repeat-label');
        var repeatBdg  = document.getElementById('repeat-badge');

        var ICON_PLAY  = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
        var ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';

        var songs = [];
        var baseUrl = '';
        var current = -1;          // index of the loaded song, -1 = none
        var rows = [];             // per-song DOM refs, parallel to songs

        // off -> one -> all -> off
        var REPEAT_MODES = [
            { id: 'off', label: 'ללא חזרה', badge: '' },
            { id: 'one', label: 'חזרה על שיר', badge: '1' },
            { id: 'all', label: 'חזרה על הסט', badge: '∞' }
        ];
        var repeatIdx = 0;

        /* ---------- helpers ---------- */

        // Encode each path segment separately so "charts/foo.pdf" keeps its slash.
        function urlFor(path) {
            return baseUrl + String(path).split('/').map(encodeURIComponent).join('/');
        }

        function fmtTime(sec) {
            if (!isFinite(sec) || sec < 0) sec = 0;
            var m = Math.floor(sec / 60);
            var s = Math.floor(sec % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        function setSeekVisual(input, pct) {
            input.value = String(pct);
            input.style.setProperty('--pct', pct + '%');
        }

        /* Every action chip is rendered on every row so the rows stay aligned;
           when the underlying asset is missing the chip is disabled instead of
           omitted, and its tooltip explains why. */
        function makeChip(cfg) {
            var btn = document.createElement('button');
            btn.className = 'chip' +
                (cfg.square ? ' square' : '') +
                (cfg.extraClass ? ' ' + cfg.extraClass : '');

            if (cfg.html) { btn.innerHTML = cfg.html; } else { btn.textContent = cfg.text; }

            var label = cfg.available ? cfg.title : cfg.unavailableTitle;
            btn.title = label;
            btn.setAttribute('aria-label', label);

            if (cfg.available) {
                btn.addEventListener('click', cfg.onClick);
            } else {
                btn.disabled = true;
            }
            return btn;
        }

        /* ---------- rendering ---------- */

        function render() {
            listEl.innerHTML = '';
            rows = [];

            songs.forEach(function (song, i) {
                var li = document.createElement('li');
                li.className = 'song';
                li.id = 'song-' + song.id;

                var row = document.createElement('div');
                row.className = 'song-row';

                var num = document.createElement('span');
                num.className = 'track-num';
                num.textContent = String(i + 1);

                var playBtn = document.createElement('button');
                playBtn.className = 'play-btn';
                playBtn.innerHTML = ICON_PLAY;
                playBtn.setAttribute('aria-label', 'נגן את ' + song.title);
                playBtn.addEventListener('click', function () { toggleSong(i); });

                var title = document.createElement('span');
                title.className = 'song-title';
                title.textContent = song.title;

                var actions = document.createElement('div');
                actions.className = 'song-actions';

                // BPM chip -> visualizer.
                actions.appendChild(makeChip({
                    text: (song.bpm ? song.bpm : '--') + ' BPM',
                    extraClass: 'bpm',
                    available: !!song.bpm,
                    title: 'הצג ויזואליזציה של הקצב',
                    unavailableTitle: 'אין נתון קצב לשיר זה',
                    onClick: function () { showModal('bpm', i); }
                }));

                // Lyrics chip -> text viewer.
                actions.appendChild(makeChip({
                    square: true,
                    html: '<svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/>' +
                          '<line x1="4" y1="11" x2="20" y2="11"/><line x1="4" y1="16" x2="13" y2="16"/></svg>',
                    available: !!song.lyrics,
                    title: 'הצג מילים',
                    unavailableTitle: 'אין מילים לשיר זה',
                    onClick: function () { showModal('lyrics', i); }
                }));

                // Chart chip -> PDF viewer.
                actions.appendChild(makeChip({
                    square: true,
                    html: '<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>' +
                          '<path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
                    available: !!song.chart,
                    title: 'הצג אקורדים',
                    unavailableTitle: 'אין אקורדים לשיר זה',
                    onClick: function () { showModal('chart', i); }
                }));

                // Download chip.
                var dlChip = makeChip({
                    square: true,
                    html: '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>' +
                          '<polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
                    available: !!song.audio,
                    title: 'הורד את ההקלטה',
                    unavailableTitle: 'אין הקלטה לשיר זה',
                    onClick: function () { download(song, dlChip); }
                });
                actions.appendChild(dlChip);

                row.appendChild(num);
                row.appendChild(playBtn);
                row.appendChild(title);
                row.appendChild(actions);

                var seekWrap = document.createElement('div');
                seekWrap.className = 'seek-wrap';

                var seek = document.createElement('input');
                seek.type = 'range';
                seek.className = 'seek';
                seek.min = '0';
                seek.max = '100';
                seek.step = '0.1';
                seek.value = '0';
                seek.setAttribute('aria-label', 'התקדמות בשיר ' + song.title);
                seek.style.setProperty('--pct', '0%');

                // Dragging an inactive song's bar loads it and seeks there.
                seek.addEventListener('input', function () {
                    var pct = parseFloat(seek.value);
                    seek.style.setProperty('--pct', pct + '%');
                    if (current === i) {
                        if (isFinite(audio.duration)) audio.currentTime = audio.duration * pct / 100;
                    } else {
                        loadSong(i, false);
                        var pending = function () {
                            if (isFinite(audio.duration)) audio.currentTime = audio.duration * pct / 100;
                            audio.removeEventListener('loadedmetadata', pending);
                        };
                        audio.addEventListener('loadedmetadata', pending);
                    }
                });

                seekWrap.appendChild(seek);
                li.appendChild(row);
                li.appendChild(seekWrap);
                listEl.appendChild(li);

                rows.push({ li: li, playBtn: playBtn, seek: seek });
            });

            countEl.textContent = songs.length + ' שירים';
            stateEl.style.display = 'none';
        }

        /* ---------- playback ---------- */

        function loadSong(i, autoplay) {
            if (i < 0 || i >= songs.length) return;
            if (current !== i) {
                current = i;
                audio.src = urlFor(songs[i].audio);
                paintActive();
            }
            if (autoplay) {
                var p = audio.play();
                if (p && p.catch) p.catch(function () { /* autoplay blocked / aborted */ });
            }
        }

        function toggleSong(i) {
            if (current === i) {
                if (audio.paused) { audio.play(); } else { audio.pause(); }
            } else {
                loadSong(i, true);
            }
        }

        function paintActive() {
            rows.forEach(function (r, i) {
                var isCur = i === current;
                r.li.classList.toggle('active', isCur);
                if (!isCur) {
                    r.playBtn.innerHTML = ICON_PLAY;
                    setSeekVisual(r.seek, 0);
                }
            });
            if (current >= 0) {
                pTitle.textContent = songs[current].title;
                player.classList.add('visible');
            }
            paintPlayState();
        }

        function paintPlayState() {
            var playing = current >= 0 && !audio.paused && !audio.ended;
            pToggle.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
            if (current >= 0 && rows[current]) {
                rows[current].playBtn.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
            }
        }

        function step(delta) {
            if (!songs.length) return;
            var next = (current < 0 ? 0 : current + delta);
            if (next < 0) next = songs.length - 1;
            if (next >= songs.length) next = 0;
            loadSong(next, true);
        }

        function onEnded() {
            var mode = REPEAT_MODES[repeatIdx].id;

            if (mode === 'one') {
                audio.currentTime = 0;
                audio.play();
                return;
            }

            var isLast = current === songs.length - 1;
            if (isLast && mode === 'off') {
                // End of the set: stop, rewind, leave the last song selected.
                audio.currentTime = 0;
                paintPlayState();
                if (rows[current]) setSeekVisual(rows[current].seek, 0);
                return;
            }
            step(1);
        }

        function cycleRepeat() {
            repeatIdx = (repeatIdx + 1) % REPEAT_MODES.length;
            var mode = REPEAT_MODES[repeatIdx];
            repeatLbl.textContent = mode.label;
            repeatBdg.textContent = mode.badge;
            repeatBtn.classList.toggle('repeat-on', mode.id !== 'off');
            repeatBtn.setAttribute('aria-pressed', mode.id !== 'off' ? 'true' : 'false');
        }

        audio.addEventListener('timeupdate', function () {
            if (current < 0 || !rows[current]) return;
            var d = audio.duration;
            var pct = isFinite(d) && d > 0 ? (audio.currentTime / d) * 100 : 0;
            setSeekVisual(rows[current].seek, pct);
            pTime.textContent = fmtTime(audio.currentTime) + ' / ' + fmtTime(d);
        });

        audio.addEventListener('loadedmetadata', function () {
            pTime.textContent = fmtTime(audio.currentTime) + ' / ' + fmtTime(audio.duration);
        });

        audio.addEventListener('play', paintPlayState);
        audio.addEventListener('pause', paintPlayState);
        audio.addEventListener('ended', onEnded);

        audio.addEventListener('error', function () {
            if (current < 0) return;
            pTitle.textContent = 'שגיאה בטעינת ' + songs[current].title;
        });

        /* ---------- download ----------
           The `download` attribute is ignored for cross-origin URLs, so a plain
           <a download> would just navigate to the MP3. Fetch to a blob instead
           (needs CORS on the bucket) and fall back to opening the URL. */
        function download(song, btn) {
            var url = urlFor(song.audio);
            btn.setAttribute('aria-busy', 'true');

            fetch(url)
                .then(function (res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.blob();
                })
                .then(function (blob) {
                    var href = URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = href;
                    a.download = song.audio;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    setTimeout(function () { URL.revokeObjectURL(href); }, 30000);
                })
                .catch(function () {
                    window.open(url, '_blank', 'noopener');
                })
                .then(function () {
                    btn.removeAttribute('aria-busy');
                });
        }

        /* ---------- BPM visualizer ---------- */
        var bpmModal = document.getElementById('bpm-modal');
        var pulseCore = document.getElementById('pulse-core');
        var pulseRing = document.getElementById('pulse-ring');
        var beatDots  = document.getElementById('beat-dots');
        var rafId = null;
        var BEATS_PER_BAR = 4;

        function stopBpmLoop() {
            if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
        }

        function renderBpm(song) {
            // Always stop the previous loop first — navigating between songs
            // would otherwise leave orphaned rAF loops fighting over the DOM.
            stopBpmLoop();

            document.getElementById('bpm-song').textContent = song.title;
            document.getElementById('bpm-value').textContent = song.bpm;

            beatDots.innerHTML = '';
            var dots = [];
            for (var b = 0; b < BEATS_PER_BAR; b++) {
                var d = document.createElement('span');
                d.className = 'beat-dot' + (b === 0 ? ' downbeat' : '');
                beatDots.appendChild(d);
                dots.push(d);
            }

            // rAF + performance.now() rather than setInterval: setInterval drifts
            // and the visual would slide out of time within a few bars.
            var interval = 60000 / song.bpm;
            var t0 = performance.now();
            var lastBeat = -1;

            function frame(now) {
                var beat = Math.floor((now - t0) / interval);
                if (beat !== lastBeat) {
                    lastBeat = beat;
                    var pos = ((beat % BEATS_PER_BAR) + BEATS_PER_BAR) % BEATS_PER_BAR;

                    dots.forEach(function (d, idx) { d.classList.toggle('on', idx === pos); });

                    pulseCore.classList.remove('hit');
                    pulseRing.classList.remove('hit');
                    // Force reflow so the animation restarts on every beat.
                    void pulseCore.offsetWidth;
                    pulseCore.classList.add('hit');
                    pulseRing.classList.add('hit');

                    setTimeout(function () { pulseCore.classList.remove('hit'); },
                              Math.min(120, interval / 2));
                }
                rafId = requestAnimationFrame(frame);
            }
            rafId = requestAnimationFrame(frame);
        }

        /* ---------- chart modal (PDF.js -> canvas) ---------- */
        var chartModal = document.getElementById('chart-modal');
        var chartViewport = document.getElementById('chart-viewport');
        var chartFrame = document.getElementById('chart-frame');
        var chartPages = document.getElementById('chart-pages');
        var chartState = document.getElementById('chart-state');
        var chartOpen  = document.getElementById('chart-open');

        /* Which renderer this browser gets.
           Inline PDF support tracks the ENGINE + PLATFORM, not the brand:
             - iOS/iPadOS: every browser is WebKit (Apple mandates it), and
               WebKit always renders PDFs inline. Chrome on iPhone included.
             - Android: Chromium ships no PDF viewer, so Chrome, Edge and
               Samsung Internet all show a blank frame. This is the case
               PDF.js exists for.
             - Desktop: Chromium has PDFium and Firefox has pdf.js built in;
               both render inline.
           navigator.pdfViewerEnabled is the standardised signal and is
           authoritative where present (Chromium 94+, Firefox 90+); the UA
           sniff below is only the fallback for older//odd engines. */
        function pickChartMode() {
            var ua = navigator.userAgent || '';
            var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                        // iPadOS 13+ reports as desktop Safari
                        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (isIOS) return 'native';           // always WebKit, always inline

            if (typeof navigator.pdfViewerEnabled === 'boolean') {
                return navigator.pdfViewerEnabled ? 'native' : 'pdfjs';
            }

            if (/Android/.test(ua)) return 'native';
            return 'native';                      // desktop engines render inline
        }

        var CHART_MODE = pickChartMode();

        var PDFJS_VER = '3.11.174';   // UMD build: no ES-module requirement
        var PDFJS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/' + PDFJS_VER + '/';

        var pdfjsPromise = null;      // resolves to the pdfjsLib namespace
        var pdfDocCache = {};         // url -> Promise<PDFDocumentProxy>
        var chartToken = 0;           // guards against out-of-order swipes
        var renderTasks = [];         // in-flight page renders, cancellable

        // Loaded on first chart open rather than at page load, so visitors who
        // never open a chart don't pay for it.
        function loadPdfJs() {
            if (pdfjsPromise) return pdfjsPromise;

            pdfjsPromise = new Promise(function (resolve, reject) {
                var s = document.createElement('script');
                s.src = PDFJS_BASE + 'pdf.min.js';
                s.onload = function () {
                    if (!window.pdfjsLib) { reject(new Error('pdfjsLib missing')); return; }
                    window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.js';
                    resolve(window.pdfjsLib);
                };
                s.onerror = function () { reject(new Error('CDN unreachable')); };
                document.head.appendChild(s);
            });

            // Let a failed load be retried on the next open.
            pdfjsPromise.catch(function () { pdfjsPromise = null; });
            return pdfjsPromise;
        }

        function chartMsg(text, isError) {
            chartState.textContent = text;
            chartState.className = 'chart-state visible' + (isError ? ' error' : '');
        }

        function chartMsgHide() { chartState.className = 'chart-state'; }

        function cancelRenders() {
            renderTasks.forEach(function (t) {
                try { t.cancel(); } catch (e) { /* already settled */ }
            });
            renderTasks = [];
        }

        function getDoc(pdfjsLib, url) {
            if (!pdfDocCache[url]) {
                pdfDocCache[url] = pdfjsLib.getDocument({ url: url }).promise;
                pdfDocCache[url].catch(function () { delete pdfDocCache[url]; });
            }
            return pdfDocCache[url];
        }

        function renderChart(song) {
            var url = urlFor(song.chart);
            chartOpen.href = url;

            if (CHART_MODE === 'native') {
                renderChartNative(url);
            } else {
                renderChartPdfJs(url);
            }
        }

        /* Native path: hand the URL to the engine's own PDF viewer.
           No CORS requirement (an iframe is not a fetch), no CDN dependency,
           and it keeps the viewer's own pinch/zoom. The #view=Fit hint is
           honoured by Chromium and ignored by WebKit — deliberately left
           as-is rather than worked around. */
        function renderChartNative(url) {
            chartToken++;               // invalidate any pending PDF.js work
            cancelRenders();
            chartPages.innerHTML = '';
            chartMsgHide();
            chartViewport.classList.add('native');
            if (/Android/i.test(navigator.userAgent)) {
                chartFrame.src = 'https://docs.google.com/viewer?url=' + encodeURIComponent(url) + '&embedded=true';
            } else {
                chartFrame.src = url + '#view=Fit&toolbar=0&navpanes=0';
            }
        }

        function renderChartPdfJs(url) {
            chartViewport.classList.remove('native');
            chartFrame.removeAttribute('src');

            var token = ++chartToken;
            cancelRenders();
            chartPages.innerHTML = '';
            chartMsg('טוען אקורדים…', false);

            loadPdfJs()
                .catch(function (e) {
                    throw new Error('טעינת ספריית PDF.js נכשלה — ' + e.message);
                })
                .then(function (pdfjsLib) {
                    return getDoc(pdfjsLib, url).catch(function (e) {
                        var detail = (e && (e.name ? e.name + ': ' : '') + (e.message || e)) || 'unknown';
                        if (e && typeof e.status === 'number') detail += ' (HTTP ' + e.status + ')';
                        throw new Error('קריאת קובץ ה-PDF נכשלה — ' + detail);
                    });
                })
                .then(function (pdf) {
                    if (token !== chartToken) return;   // superseded by a swipe
                    return drawPages(pdf, token);
                })
                .catch(function (err) {
                    if (token !== chartToken) return;
                    chartMsg(err.message + ' · נסו לפתוח את ה-PDF בלשונית חדשה.', true);
                    // Full object in the console for diagnosis.
                    if (window.console) console.error('[chart]', url, err);
                });
        }

        function drawPages(pdf, token) {
            var cw = chartViewport.clientWidth;
            var ch = chartViewport.clientHeight;
            if (!cw || !ch) return;

            var single = pdf.numPages === 1;
            // Render above CSS size so pinch-zooming stays sharp.
            var pixelScale = Math.min(3, (window.devicePixelRatio || 1) * 1.5);

            var seq = Promise.resolve();
            for (var p = 1; p <= pdf.numPages; p++) {
                seq = seq.then(makePageStep(pdf, p, token, cw, ch, single, pixelScale));
            }

            return seq.then(function () {
                if (token === chartToken) chartMsgHide();
            });
        }

        function makePageStep(pdf, pageNum, token, cw, ch, single, pixelScale) {
            return function () {
                if (token !== chartToken) return;

                return pdf.getPage(pageNum).then(function (page) {
                    if (token !== chartToken) return;

                    var base = page.getViewport({ scale: 1 });
                    // Real page dimensions, so this is an exact fit: whole page
                    // for a single-page chart, fit-to-width when it scrolls.
                    var fit = single
                        ? Math.min(cw / base.width, ch / base.height)
                        : cw / base.width;

                    var vp = page.getViewport({ scale: fit * pixelScale });
                    var canvas = document.createElement('canvas');
                    canvas.width = Math.floor(vp.width);
                    canvas.height = Math.floor(vp.height);
                    canvas.style.width = Math.floor(vp.width / pixelScale) + 'px';
                    canvas.style.height = Math.floor(vp.height / pixelScale) + 'px';
                    chartPages.appendChild(canvas);

                    var task = page.render({
                        canvasContext: canvas.getContext('2d'),
                        viewport: vp
                    });
                    renderTasks.push(task);
                    return task.promise.catch(function (e) {
                        if (e && e.name === 'RenderingCancelledException') return;
                        throw e;
                    });
                });
            };
        }

        // Canvases are raster, so a resize needs a re-render, not a rescale.
        // The native iframe reflows itself, so it needs nothing here.
        var chartResizeTimer = null;
        function reflowChart() {
            if (CHART_MODE !== 'pdfjs') return;
            if (activeKind !== 'chart' || activeIdx < 0) return;
            clearTimeout(chartResizeTimer);
            chartResizeTimer = setTimeout(function () {
                if (activeKind === 'chart' && activeIdx >= 0) renderChart(songs[activeIdx]);
            }, 200);
        }

        window.addEventListener('resize', reflowChart);
        window.addEventListener('orientationchange', reflowChart);

        /* ---------- lyrics modal ----------
           Plain-text files fetched from S3 (needs bucket CORS). Results are
           cached per song so reopening is instant. */
        var lyricsModal = document.getElementById('lyrics-modal');
        var lyricsTitle = document.getElementById('lyrics-title');
        var lyricsBody  = document.getElementById('lyrics-body');
        var lyricsCache = {};
        var lyricsReq = 0;

        function renderLyrics(song) {
            lyricsTitle.textContent = song.title;
            lyricsBody.scrollTop = 0;

            if (Object.prototype.hasOwnProperty.call(lyricsCache, song.id)) {
                lyricsBody.className = 'lyrics-body';
                lyricsBody.textContent = lyricsCache[song.id];
                return;
            }

            lyricsBody.className = 'lyrics-body msg';
            lyricsBody.textContent = 'טוען מילים…';

            // Swiping fast can start several fetches; only the newest may paint.
            var token = ++lyricsReq;
            var url = urlFor(song.lyrics);

            fetch(url)
                .then(function (res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.text();
                })
                .then(function (text) {
                    lyricsCache[song.id] = text;
                    if (token !== lyricsReq) return;
                    lyricsBody.className = 'lyrics-body';
                    lyricsBody.textContent = text;
                    lyricsBody.scrollTop = 0;
                })
                .catch(function (err) {
                    if (token !== lyricsReq) return;
                    lyricsBody.className = 'lyrics-body msg';
                    lyricsBody.textContent = 'לא ניתן לטעון את המילים (' + err.message + '). ';
                    var a = document.createElement('a');
                    a.href = url;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    a.textContent = 'פתח את הקובץ בלשונית חדשה';
                    lyricsBody.appendChild(a);
                });
        }

        /* ---------- shared modal controller ----------
           One place that knows which modal is open and on which song, so
           swipe / arrow navigation can walk the setlist without closing it. */
        var MODALS = {
            bpm:    { el: bpmModal,    render: renderBpm,    has: function (s) { return !!s.bpm; } },
            chart:  { el: chartModal,  render: renderChart,  has: function (s) { return !!s.chart; } },
            lyrics: { el: lyricsModal, render: renderLyrics, has: function (s) { return !!s.lyrics; } }
        };

        var activeKind = null;
        var activeIdx = -1;
        var navRefs = {};

        // Indices of songs that actually have this asset, so navigation skips
        // the ones that would open an empty view.
        function eligible(kind) {
            var has = MODALS[kind].has;
            var out = [];
            songs.forEach(function (s, i) { if (has(s)) out.push(i); });
            return out;
        }

        function showModal(kind, idx) {
            var cfg = MODALS[kind];
            if (!cfg || !songs[idx]) return;

            activeKind = kind;
            activeIdx = idx;

            // Activate before rendering: the chart fit needs real dimensions,
            // and a display:none container measures 0.
            cfg.el.classList.add('active');
            cfg.render(songs[idx]);
            updateNav();
        }

        function closeModal() {
            if (!activeKind) return;
            var cfg = MODALS[activeKind];
            cfg.el.classList.remove('active');

            if (activeKind === 'bpm') stopBpmLoop();
            if (activeKind === 'chart') {
                chartToken++;          // invalidate any in-flight load
                cancelRenders();
                chartPages.innerHTML = '';   // free canvas memory
                chartFrame.removeAttribute('src');   // stop the native viewer
                chartMsgHide();
            }

            activeKind = null;
            activeIdx = -1;
        }

        function navigateModal(delta) {
            if (!activeKind) return;
            var list = eligible(activeKind);
            if (list.length < 2) return;

            var pos = list.indexOf(activeIdx);
            if (pos === -1) pos = 0;
            var next = (pos + delta + list.length) % list.length;
            showModal(activeKind, list[next]);
        }

        function updateNav() {
            var list = eligible(activeKind);
            var pos = list.indexOf(activeIdx);
            var refs = navRefs[activeKind];
            if (!refs) return;

            refs.counter.textContent = (pos + 1) + ' / ' + list.length;
            var single = list.length < 2;
            refs.prev.disabled = single;
            refs.next.disabled = single;
            refs.wrap.style.display = single ? 'none' : '';
        }

        // Build the prev / counter / next pill inside each modal once.
        Object.keys(MODALS).forEach(function (kind) {
            var wrap = document.createElement('div');
            wrap.className = 'modal-nav';

            var prev = document.createElement('button');
            prev.className = 'modal-nav-btn';
            prev.innerHTML = '&#10094;';
            prev.setAttribute('aria-label', 'הקודם');
            prev.addEventListener('click', function () { navigateModal(-1); });

            var counter = document.createElement('span');
            counter.className = 'modal-nav-counter';

            var next = document.createElement('button');
            next.className = 'modal-nav-btn';
            next.innerHTML = '&#10095;';
            next.setAttribute('aria-label', 'הבא');
            next.addEventListener('click', function () { navigateModal(1); });

            wrap.appendChild(prev);
            wrap.appendChild(counter);
            wrap.appendChild(next);
            MODALS[kind].el.appendChild(wrap);

            navRefs[kind] = { wrap: wrap, prev: prev, counter: counter, next: next };
        });

        /* ---------- swipe ----------
           Touch events inside a cross-origin <iframe> never reach us, so on the
           chart modal a swipe landing on the PDF itself is consumed by the PDF
           viewer; the surrounding area and the arrow buttons still work. */
        var SWIPE_MIN = 50;        // px of horizontal travel required
        var SWIPE_RATIO = 1.5;     // must be this much more horizontal than vertical
        var touchX = 0, touchY = 0, touching = false;

        Object.keys(MODALS).forEach(function (kind) {
            var el = MODALS[kind].el;

            el.addEventListener('touchstart', function (e) {
                if (e.touches.length !== 1) { touching = false; return; }
                touching = true;
                touchX = e.touches[0].clientX;
                touchY = e.touches[0].clientY;
            }, { passive: true });

            el.addEventListener('touchend', function (e) {
                if (!touching) return;
                touching = false;

                var t = e.changedTouches[0];
                var dx = t.clientX - touchX;
                var dy = t.clientY - touchY;

                if (Math.abs(dx) < SWIPE_MIN) return;
                // Let vertical drags scroll the lyrics instead of navigating.
                if (Math.abs(dx) < Math.abs(dy) * SWIPE_RATIO) return;

                // Swipe left advances, matching the arrow-key mapping in
                // index.html (ArrowRight = next) and standard gallery behaviour.
                navigateModal(dx < 0 ? 1 : -1);
            }, { passive: true });
        });

        /* ---------- wiring ---------- */
        document.getElementById('play-all').addEventListener('click', function () {
            loadSong(0, true);
        });
        repeatBtn.addEventListener('click', cycleRepeat);
        pToggle.addEventListener('click', function () {
            if (current < 0) { loadSong(0, true); return; }
            if (audio.paused) { audio.play(); } else { audio.pause(); }
        });
        document.getElementById('p-prev').addEventListener('click', function () { step(-1); });
        document.getElementById('p-next').addEventListener('click', function () { step(1); });
        document.getElementById('bpm-close').addEventListener('click', closeModal);
        document.getElementById('chart-close').addEventListener('click', closeModal);
        document.getElementById('lyrics-close').addEventListener('click', closeModal);

        Object.keys(MODALS).forEach(function (kind) {
            MODALS[kind].el.addEventListener('click', function (e) {
                if (e.target === MODALS[kind].el) closeModal();
            });
        });

        document.addEventListener('keydown', function (e) {
            var tag = (e.target.tagName || '').toLowerCase();
            var typing = tag === 'input' || tag === 'textarea' || tag === 'select';

            if (activeKind) {
                if (e.key === 'Escape') { closeModal(); return; }
                // PC equivalent of the swipe. Matches index.html's lightbox:
                // ArrowRight = next, ArrowLeft = previous.
                if (e.key === 'ArrowRight') { e.preventDefault(); navigateModal(1); return; }
                if (e.key === 'ArrowLeft')  { e.preventDefault(); navigateModal(-1); return; }
                return;   // don't let Space reach the player while a modal is up
            }

            if (e.code === 'Space' && !typing) {
                e.preventDefault();
                pToggle.click();
            }
        });

        /* ---------- load data ----------
           fetch() is subject to CORS and a file:// origin is opaque, so opening
           this page by double-clicking it can never read the JSON. Detect that
           up front — the browser's own message ("Load failed") is unhelpful. */
        if (location.protocol === 'file:') {
            stateEl.className = 'state-msg error';
            stateEl.innerHTML =
                'הדף נפתח ישירות מהקובץ (file://) ולכן הדפדפן חוסם את טעינת הנתונים.<br>' +
                'להרצה מקומית יש להריץ שרת מקומי בתיקיית הפרויקט:<br>' +
                '<code style="display:inline-block;margin-top:8px;padding:6px 12px;' +
                'background:rgba(255,255,255,0.08);border-radius:6px;direction:ltr">' +
                'python3 -m http.server 8000</code><br>' +
                '<span style="font-size:0.85rem">ואז לפתוח ' +
                '<span style="direction:ltr;display:inline-block">http://localhost:8000/setlist.html</span></span>';
            return;
        }

        fetch('data/setlist.json', { cache: 'no-cache' })
            .then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(function (data) {
                baseUrl = data.baseUrl || '';
                songs = Array.isArray(data.songs) ? data.songs : [];
                if (!songs.length) {
                    stateEl.textContent = 'הסטליסט ריק.';
                    return;
                }
                render();
            })
            .catch(function (err) {
                stateEl.className = 'state-msg error';
                stateEl.textContent =
                    'לא ניתן לטעון את הסטליסט: ' + err.message +
                    ' — ודאו שהקובץ data/setlist.json קיים ונגיש.';
            });
    })();
    </script>
</body>
</html>
