<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חוגזי | Choogzi - הופעה חיה</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #16181f;
            --accent-color: #e6683c;
            --accent-hover: #ff7b4d;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --insta-grad: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            --glass-bg: rgba(22, 24, 31, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(220, 39, 67, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(188, 24, 136, 0.08) 0%, transparent 40%);
        }

        /* Header / Hero */
        header {
            padding: 4.5rem 1.5rem 3rem;
            text-align: center;
            position: relative;
            background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
        }

        .band-logo {
            font-size: 4.5rem;
            font-weight: 900;
            letter-spacing: -1.5px;
            background: linear-gradient(135deg, #ffffff 30%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .band-subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            font-weight: 300;
            margin-bottom: 2rem;
        }

        .insta-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--insta-grad);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.05rem;
            box-shadow: 0 4px 25px rgba(220, 39, 67, 0.35);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .insta-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 35px rgba(220, 39, 67, 0.55);
        }

        .insta-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Controls / Filter Section */
        .controls {
            max-width: 1280px;
            margin: 0 auto 2.5rem;
            padding: 0 1.5rem;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filter-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 8px 20px;
            border-radius: 30px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.25s ease;
        }

        .filter-btn:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.08);
        }

        .filter-btn.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        /* Main Container */
        main {
            flex: 1;
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
            padding: 0 1.5rem 4rem;
        }

        /* Bento Grid Gallery */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 260px;
            gap: 16px;
        }

        .gallery-item {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: var(--card-bg);
            cursor: pointer;
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        /* Bento spans for variety */
        .gallery-item.featured {
            grid-column: span 2;
            grid-row: span 2;
        }

        .gallery-item.wide {
            grid-column: span 2;
            grid-row: span 1;
        }

        .gallery-item.tall {
            grid-column: span 1;
            grid-row: span 2;
        }

        .gallery-item:hover {
            transform: translateY(-6px) scale(1.01);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            z-index: 2;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .gallery-item:hover img {
            transform: scale(1.07);
        }

        /* Hover Overlay */
        .item-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 40%, rgba(0, 0, 0, 0.85) 100%);
            opacity: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            transition: opacity 0.3s ease;
        }

        .gallery-item:hover .item-overlay {
            opacity: 1;
        }

        .overlay-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
            transform: translateY(10px);
            transition: transform 0.3s ease;
        }

        .overlay-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
            transform: translateY(10px);
            transition: transform 0.3s ease 0.05s;
        }

        .gallery-item:hover .overlay-title,
        .gallery-item:hover .overlay-sub {
            transform: translateY(0);
        }

        .zoom-icon {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 36px;
            height: 36px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            transform: scale(0.8);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .gallery-item:hover .zoom-icon {
            transform: scale(1);
            opacity: 1;
        }

        /* Lightbox Modal with Navigation */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5, 6, 8, 0.95);
            z-index: 1000;
            backdrop-filter: blur(15px);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            user-select: none;
        }

        .lightbox.active {
            display: flex;
            animation: fadeIn 0.25s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 82vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lightbox-img {
            max-width: 100%;
            max-height: 82vh;
            border-radius: 12px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
            object-fit: contain;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .lightbox-caption {
            margin-top: 15px;
            color: var(--text-muted);
            font-size: 1rem;
            text-align: center;
        }

        /* Nav Controls */
        .lb-btn {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.5rem;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
            z-index: 1010;
        }

        .lb-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }

        .lb-close {
            top: 25px;
            left: 25px;
        }

        .lb-prev {
            right: 25px;
            top: 50%;
            transform: translateY(-50%);
        }

        .lb-next {
            left: 25px;
            top: 50%;
            transform: translateY(-50%);
        }

        .lb-prev:hover {
            transform: translateY(-50%) scale(1.1);
        }

        .lb-next:hover {
            transform: translateY(-50%) scale(1.1);
        }

        .lb-counter {
            position: absolute;
            top: 30px;
            right: 30px;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2.5rem 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
        }

        /* Responsive Breakpoints */
        @media (max-width: 1024px) {
            .gallery-grid {
                grid-template-columns: repeat(3, 1fr);
                grid-auto-rows: 240px;
            }
        }

        @media (max-width: 768px) {
            .band-logo {
                font-size: 3.2rem;
            }

            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: 220px;
                gap: 12px;
            }

            .gallery-item.featured,
            .gallery-item.wide,
            .gallery-item.tall {
                grid-column: span 1;
                grid-row: span 1;
            }

            /* On mobile, allow the first highlight to span 2 cols */
            .gallery-item.featured {
                grid-column: span 2;
                grid-row: span 2;
            }

            .lb-prev { right: 10px; }
            .lb-next { left: 10px; }
        }

        @media (max-width: 480px) {
            .band-logo {
                font-size: 2.5rem;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
                grid-auto-rows: 260px;
            }

            .gallery-item.featured {
                grid-column: span 1;
                grid-row: span 1;
            }
        }
    </style>
</head>

            }
        ];

        let currentFiltered = [...galleryData];
        let currentIndex = 0;

        const gallery = document.getElementById('gallery');

        function renderGallery(filter = 'all') {
            gallery.innerHTML = '';
            
            if (filter === 'all') {
                currentFiltered = [...galleryData];
            } else {
                currentFiltered = galleryData.filter(item => item.category === filter);
            }

            currentFiltered.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `gallery-item ${item.layout || 'standard'}`;
                card.onclick = () => openLightbox(index);
                
                card.innerHTML = `
                    <img src="${item.src}" alt="${item.title}" loading="lazy">
                    <div class="zoom-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            <line x1="11" y1="8" x2="11" y2="14"/>
                            <line x1="8" y1="11" x2="14" y2="11"/>
                        </svg>
                    </div>
                    <div class="item-overlay">
                        <div class="overlay-title">${item.title}</div>
                        <div class="overlay-sub">${item.sub}</div>
                    </div>
                `;
                gallery.appendChild(card);
            });
        }

        function filterGallery(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderGallery(category);
        }

        /* Lightbox Functions */
        function openLightbox(index) {
            currentIndex = index;
            updateLightbox();
            const lb = document.getElementById('lightbox');
            lb.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lb = document.getElementById('lightbox');
            lb.classList.remove('active');
            document.body.style.overflow = '';
        }

        function navigateLightbox(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = currentFiltered.length - 1;
            if (currentIndex >= currentFiltered.length) currentIndex = 0;
            updateLightbox();
        }

        function updateLightbox() {
            const item = currentFiltered[currentIndex];
            document.getElementById('lb-img').src = item.src;
            document.getElementById('lb-caption').textContent = `${item.title} — ${item.sub}`;
            document.getElementById('lb-counter').textContent = `${currentIndex + 1} / ${currentFiltered.length}`;
        }

        /* Keyboard Shortcuts */
        document.addEventListener('keydown', (e) => {
            const lb = document.getElementById('lightbox');
            if (!lb.classList.contains('active')) return;
            
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
        });

        // Initialize Gallery
        renderGallery();
    </script>
</body>
</html>
