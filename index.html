<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חוגזי | Choogzi</title>
    
    <!-- Google Fonts: Heebo & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-color: #e50914;
            --accent-hover: #ff1e27;
            --text-main: #ffffff;
            --text-muted: #c5c6c7;
            --insta-grad: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Hero Section */
        header {
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(11,12,16,1) 100%), 
                        radial-gradient(circle at center, rgba(229, 9, 20, 0.15) 0%, transparent 70%);
            padding: 4rem 1.5rem 3rem;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .band-title {
            font-family: 'Heebo', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffffff 0%, #a5a5a5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .band-subtitle {
            font-size: 1.25rem;
            color: var(--text-muted);
            font-weight: 300;
            margin-bottom: 2rem;
        }

        .insta-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--insta-grad);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 4px 20px rgba(220, 39, 67, 0.4);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .insta-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 30px rgba(220, 39, 67, 0.6);
        }

        .insta-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Gallery Section */
        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: var(--card-bg);
            aspect-ratio: 4 / 3;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        /* Placeholder state when no images are uploaded yet */
        .placeholder-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            text-align: center;
            color: var(--text-muted);
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
        }

        .placeholder-box svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        /* Lightbox Modal */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(8px);
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 25px;
            color: white;
            font-size: 2.5rem;
            cursor: pointer;
            line-height: 1;
            user-select: none;
            transition: color 0.2s ease;
        }

        .lightbox-close:hover {
            color: var(--accent-color);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem 1.5rem;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 600px) {
            .band-title {
                font-size: 2.8rem;
            }
            header {
                padding: 3rem 1rem 2rem;
            }
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1 class="band-title">חוגזי</h1>
        <p class="band-subtitle">תמונות מההופעה האחרונה ועדכונים</p>
        
        <a href="https://www.instagram.com/choogzi?igsh=MWs2Nnl0eXBmcjlxZg==" target="_blank" rel="noopener noreferrer" class="insta-btn">
            <svg viewBox="0 0 24 24">
                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
            עקבו אחרינו באינסטגרם
        </a>
    </header>

    <main>
        <h2 class="section-title">גלריית תמונות מההופעה</h2>
        <div class="gallery-grid" id="gallery">
            <!-- Photos will be dynamically rendered or placed here -->
        </div>
    </main>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="תמונה מההופעה">
    </div>

    <footer>
        &copy; <span id="year"></span> חוגזי - כל הזכויות שמורות
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        // List of image files inside the 'images' folder
        // You can add image paths here, e.g. ['images/1.jpg', 'images/2.jpg']
        const imageList = [];

        const gallery = document.getElementById('gallery');

        function renderGallery() {
            gallery.innerHTML = '';
            
            if (imageList.length === 0) {
                // Show placeholder state until photos are uploaded
                gallery.innerHTML = `
                    <div class="gallery-item" style="grid-column: 1 / -1;">
                        <div class="placeholder-box">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                <circle cx="8.5" cy="8.5" r="1.5"/>
                                <polyline points="21 15 16 10 5 21"/>
                            </svg>
                            <p style="font-size: 1.1rem; font-weight: 500; margin-bottom: 6px;">התמונות מההופעה יעלו לכאן בקרוב!</p>
                            <p style="font-size: 0.9rem; opacity: 0.7;">העלה את קבצי התמונות לתיקיית images ברפוזיטורי</p>
                        </div>
                    </div>
                `;
                return;
            }

            imageList.forEach((src, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.onclick = () => openLightbox(src);
                item.innerHTML = `<img src="${src}" alt="חוגזי בהופעה ${index + 1}" loading="lazy">`;
                gallery.appendChild(item);
            });
        }

        function openLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            img.src = src;
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }

        renderGallery();
    </script>
</body>
</html>
